name: Flutter CI

# Sole purpose: put the Flutter vertical slice in front of a real compiler.
# This workflow verifies the current Flutter app and also performs a real
# Flutter Web build so PWA/web compatibility is checked in CI.
#
# This workflow does NOT build an APK/IPA, publish anything, or touch Supabase.

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Pinned Flutter version for reproducible CI.
  FLUTTER_VERSION: "3.32.0"

jobs:
  verify:
    name: pub get -> codegen -> analyze -> test -> build web
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('app/pubspec.yaml') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      # ---- 1 ------------------------------------------------------------------
      - name: flutter --version
        run: flutter --version

      # ---- 2 ------------------------------------------------------------------
      - name: flutter pub get
        run: flutter pub get

      # ---- 3 ------------------------------------------------------------------
      - name: Generate Drift code (build_runner)
        id: codegen
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Confirm the generated file exists
        shell: bash
        run: |
          if [ ! -f lib/data/local/app_database.g.dart ]; then
            echo "::error::build_runner reported success but app_database.g.dart is missing."
            echo "Analysis would be meaningless without it. Failing early."
            exit 1
          fi
          echo "Generated $(wc -l < lib/data/local/app_database.g.dart) lines."

      # ---- 4 ------------------------------------------------------------------
      - name: flutter analyze
        run: flutter analyze

      # ---- 5 ------------------------------------------------------------------
      - name: flutter test
        run: flutter test --reporter expanded --file-reporter json:test-results.json

      # ---- 6 ------------------------------------------------------------------
      - name: Build Flutter Web
        run: flutter build web

      # ---- diagnostics --------------------------------------------------------
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-diagnostics
          path: |
            app/test-results.json
            app/lib/data/local/app_database.g.dart
          if-no-files-found: ignore
          retention-days: 14

  bootstrap-guard:
    name: Bootstrap consistency
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generated code has a generator declared
        shell: bash
        run: |
          parts=$(grep -rl "^part '" lib | wc -l)
          if [ "$parts" -gt 0 ] && ! grep -qE '^  build_runner:' pubspec.yaml; then
            echo "::error::lib declares a 'part' directive but build_runner is not in dev_dependencies."
            exit 1
          fi

      - name: No generated code committed
        shell: bash
        run: |
          if find lib -name '*.g.dart' | grep -q .; then
            echo "::error::A .g.dart file is committed. It will drift from its source."
            exit 1
          fi

      - name: No asserted font paths without the font files
        shell: bash
        run: |
          active=$(grep -cE '^        - asset: assets/fonts/' pubspec.yaml || true)

          if [ "$active" -gt 0 ]; then
            missing=0

            while read -r f; do
              if [ ! -f "$f" ]; then
                echo "::error::pubspec declares missing font: $f"
                missing=1
              fi
            done < <(
              grep -E '^        - asset: assets/fonts/' pubspec.yaml |
              sed 's/.*asset: //'
            )

            [ "$missing" -eq 0 ] || exit 1
          fi

      - name: Declared asset directories exist
        shell: bash
        run: |
          fail=0

          while read -r d; do
            if [ ! -d "$d" ]; then
              echo "::error::declared asset dir missing: $d"
              fail=1
            fi
          done < <(
            grep -E '^    - assets/' pubspec.yaml |
            sed 's/^    - //'
          )

          exit $fail

      - name: No secrets committed
        shell: bash
        run: |
          patterns='(sbp_[a-zA-Z0-9]{20,}|sk-[a-zA-Z0-9]{20,}|eyJ[A-Za-z0-9_-]{30,}\.[A-Za-z0-9_-]{20,}|(service_role|serviceRole)[A-Za-z]*[[:space:]]*[:=][[:space:]]*.?[A-Za-z0-9_-]{16,})'

          if grep -rnE "$patterns" lib 2>/dev/null; then
            echo "::error::possible hard-coded secret in app source (see matches above)."
            exit 1
          fi

          echo "No secret values found in app/lib."
